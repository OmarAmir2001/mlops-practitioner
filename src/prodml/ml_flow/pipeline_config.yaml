# config.yaml
active_model: "xgboost"  # Switch this to "logistic" or "random_forest" to run different experiments

cross_validation:
  cv_folds: 5
  scoring_metric: "f1"

models:
  logistic:
    C: 0.1
    max_iter: 1000
    solver: "lbfgs"      # Fixed categorical choice

  random_forest:
    n_estimators: 150
    max_depth: 12
    random_state: 42

  xgboost:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8

  mlp:
    n_layers: 2
    hidden_size: 128
    dropout: 0.2
    learning_rate: 0.001
    epochs: 100
    batch_size: 32