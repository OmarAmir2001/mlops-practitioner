[project]
name = "prodml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "scikit-learn",
    "pandas",
    "pyarrow",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "xgboost>=3.4.1",
    "structlog>=26.1.0",
    "mlflow>=3.15.2",
    "psycopg2-binary>=2.9.12",
    "boto3>=1.43.80",
    "gitpython>=3.1.60",
    "torch",
    "optuna",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "black", "mypy", "httpx", "pre-commit"]

[project.scripts]
prodml-serve = "prodml.run:main"

[tool.pytest.ini_options]
addopts = "--cov=src/prodml --cov-fail-under=70"

[tool.coverage.run]
omit = [
    "src/prodml/ml_flow/train.py",
    "src/prodml/ml_flow/sweep.py",
    "src/prodml/ml_flow/wrapper.py",
    "src/prodml/run.py",
]

[tool.black]
target-version = ["py314"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
"src/prodml/api/*.py" = ["B008"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"